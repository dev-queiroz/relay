
name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build && npm test
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check production configuration has no credential defaults
        run: |
          if rg -n 'spring\.datasource\.(username|password)\s*=\s*\$\{[^}:]+:[^}]*\}' src/main/resources; then
            echo 'Production datasource credentials must not define Spring placeholder defaults.' >&2
            exit 1
          fi
          if rg -n 'relay\.secrets\.encryption-key\s*=\s*\$\{[^}:]+:[^}]*\}' src/main/resources; then
            echo 'The encryption key must not define a Spring placeholder default.' >&2
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: ./mvnw --batch-mode verify

  m3-security-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run M3 adversarial security gate
        run: ./scripts/run-m3-security-gate.sh
