services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in the environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the environment}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - relay-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d relay"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  relay-postgres-data:
