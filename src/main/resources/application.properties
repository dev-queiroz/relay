spring.application.name=relay

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
relay.secrets.encryption-key=${RELAY_SECRETS_ENCRYPTION_KEY}

# Never include exception messages or stack traces in HTTP responses: they may contain credentials or payloads.
server.error.include-message=never
server.error.include-stacktrace=never
spring.flyway.enabled=true

# This local-only value is deliberately server-side. Do not derive it from headers or JSON.
relay.ingestion.development-tenant-id=local-development-tenant
relay.limits.ingestion-requests-per-minute=60
relay.limits.events-per-tenant-per-day=10000
