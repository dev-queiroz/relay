spring.application.name=relay

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true

# This local-only value is deliberately server-side. Do not derive it from headers or JSON.
relay.ingestion.development-tenant-id=local-development-tenant
# Local-only fixture origins. Public or arbitrary outbound targets are not supported in M2.
relay.delivery.local-target-allowlist=http://127.0.0.1:8081,http://localhost:8081
